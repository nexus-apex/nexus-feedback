{% extends "base.html" %}
{% block title %}{% if editing %}Edit{% else %}New{% endif %} FeedbackItem | NexusFeedback{% endblock %}
{% block page_title %}{% if editing %}Edit FeedbackItem{% else %}New FeedbackItem{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:750px">
  <form method="post">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" value="{{ record.title|default:'' }}">
      </div>
      <div class="form-group">
        <label>Customer Name</label>
        <input type="text" name="customer_name" value="{{ record.customer_name|default:'' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Customer Email</label>
        <input type="email" name="customer_email" value="{{ record.customer_email|default:'' }}">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select name="category">
          <option value="bug" {% if record.category == 'bug' %}selected{% endif %}>Bug</option>
          <option value="feature" {% if record.category == 'feature' %}selected{% endif %}>Feature</option>
          <option value="complaint" {% if record.category == 'complaint' %}selected{% endif %}>Complaint</option>
          <option value="praise" {% if record.category == 'praise' %}selected{% endif %}>Praise</option>
          <option value="suggestion" {% if record.category == 'suggestion' %}selected{% endif %}>Suggestion</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Rating</label>
        <input type="number" name="rating" value="{{ record.rating|default:'0' }}">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="new" {% if record.status == 'new' %}selected{% endif %}>New</option>
          <option value="acknowledged" {% if record.status == 'acknowledged' %}selected{% endif %}>Acknowledged</option>
          <option value="in_progress" {% if record.status == 'in_progress' %}selected{% endif %}>In Progress</option>
          <option value="resolved" {% if record.status == 'resolved' %}selected{% endif %}>Resolved</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Priority</label>
        <select name="priority">
          <option value="low" {% if record.priority == 'low' %}selected{% endif %}>Low</option>
          <option value="medium" {% if record.priority == 'medium' %}selected{% endif %}>Medium</option>
          <option value="high" {% if record.priority == 'high' %}selected{% endif %}>High</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description">{{ record.description|default:'' }}</textarea>
    </div>

    <div style="display:flex;gap:0.75rem;margin-top:1rem">
      <button type="submit" class="btn btn-primary">{% if editing %}Update{% else %}Create{% endif %} FeedbackItem</button>
      <a href="/feedbackitems/" class="btn" style="background:var(--border);color:var(--text)">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
